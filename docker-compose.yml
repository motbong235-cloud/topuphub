# Local development services only (Postgres 16 + Redis 7). The apps run with `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: topuphub
      POSTGRES_PASSWORD: topuphub
      POSTGRES_DB: topuphub
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  dbdata:
